name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --only-binary=:all: -e ".[dev]"
      - run: |
          python -c "from pathlib import Path; Path('.test-tmp').mkdir(exist_ok=True)"
          python -m pytest tests -q -p no:cacheprovider --basetemp .test-tmp/ci
