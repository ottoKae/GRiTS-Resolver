[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grits-resolver"
version = "0.3.1rc1"
description = "Lazy S1-GRiTS and S2-GRiTS virtual cube resolver"
requires-python = ">=3.12,<3.13"
dependencies = ["affine", "numpy", "pandas", "pyarrow", "rasterio", "xarray", "zarr>=3"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
grits-resolver = "grits_resolver.cli:main"
